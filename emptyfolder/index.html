<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>iSECURITI</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f8fc; color: #18304a; font-family: Arial, Helvetica, sans-serif; }
		main { width: min(940px, 100%); min-height: 500px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; background: #fff; border: 1px solid #e6ecf3; border-radius: 22px; box-shadow: 0 20px 60px #19395712; }
		.intro { padding: clamp(32px, 7vw, 72px); display: flex; flex-direction: column; justify-content: center; }
		.logo { display: inline-flex; align-items: center; gap: 11px; color: #18304a; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
		.logo-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: linear-gradient(145deg, #18b8c5, #3478dc); }
		.logo-icon svg { width: 25px; height: 25px; }
		.tagline { margin: 56px 0 13px; color: #178eaa; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
		h1 { margin: 0; max-width: 430px; font-size: clamp(38px, 5vw, 54px); line-height: 1.08; letter-spacing: -2px; }
		.copy { max-width: 390px; margin: 20px 0 0; color: #6b7b8e; font-size: 16px; line-height: 1.7; }
		.art { position: relative; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle, #f8ffff 0, #e8f5ff 54%, #deebf8 100%); }
		.ring { position: absolute; width: 330px; height: 330px; border: 1px solid #fff; border-radius: 50%; }
		.ring.outer { width: 440px; height: 440px; }
		.shield { z-index: 1; width: 154px; height: 174px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #1cbcc4, #3479dc); clip-path: polygon(50% 0, 94% 16%, 89% 64%, 76% 82%, 50% 100%, 24% 82%, 11% 64%, 6% 16%); filter: drop-shadow(0 15px 20px #327cbd55); }
		.shield svg { width: 64px; height: 64px; }
		.caption { position: absolute; bottom: 30px; color: #526a86; font-size: 13px; }
		@media (max-width: 650px) { main { grid-template-columns: 1fr; } .intro { padding: 34px; } .tagline { margin-top: 40px; } .art { min-height: 250px; } .shield { width: 110px; height: 125px; } .caption { bottom: 18px; } }
	</style>
</head>
<body>
	<main>
		<section class="intro" aria-labelledby="page-title">
			<div class="logo" aria-label="iSECURITI logo">
				<span class="logo-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8 20 6v5.1c0 5.2-3.4 8.6-8 10.1-4.6-1.5-8-4.9-8-10.1V6l8-3.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m8.8 12.1 2.1 2.1 4.5-4.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
				<span>iSECURITI</span>
			</div>
			<p class="tagline">Privacy. Security. Trust.</p>
			<h1 id="page-title">Protecting data. Empowering trust.</h1>
			<p class="copy">A smarter foundation for privacy and data security—designed to help you protect what matters.</p>
		</section>
		<aside class="art" aria-label="Data protection illustration">
			<span class="ring" aria-hidden="true"></span><span class="ring outer" aria-hidden="true"></span>
			<div class="shield" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M32 8 49 15v11c0 11-7.2 18.2-17 22-9.8-3.8-17-11-17-22V15l17-7Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="m24 29 5.5 5.5L40 23" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
			<span class="caption">Your data, safeguarded.</span>
		</aside>
	</main>
</body>
</html>
